name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unzip project
        run: unzip -q islamic_app.zip

      - name: Create Android project and patch it
        working-directory: islamic_app
        run: |
          flutter create --platforms=android --org com.nasim .
          python3 tools/patch_android.py

      - name: Build APK
        working-directory: islamic_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Iman Ano APK (build ${{ github.run_number }})
          files: islamic_app/build/app/outputs/flutter-apk/app-release.apk
